name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-alpha.N, a pre-release) that matches Cargo.toml's version
# builds the binaries, publishes them as a GitHub release, and pushes the Docker image to
# ghcr.io. A pull request that changes the release files builds and packages everything
# the same way, without publishing, so the pipeline is checked before it's needed.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - deploy/Dockerfile.release
      - about.toml
      - about.hbs
      - tools/smoke-test.sh

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Built against glibc 2.28 (2018: Debian 10, Ubuntu 18.10, RHEL 8 and later) with
      # GCC, as fast as a native build. A static musl build was 25-70% slower in the
      # in-process benchmark (musl's memcpy and friends), so there isn't one.
      - name: Build (glibc 2.28)
        run: |
          docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} bash -euo pipefail -c '
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -q
            source "$HOME/.cargo/env"
            cargo build --release --locked --bin tantalum
            strip target/release/tantalum
            chown -R '"$(id -u):$(id -g)"' target'
      - name: Smoke test
        run: tools/smoke-test.sh target/release/tantalum
      - name: Runs on the oldest glibc it supports
        run: docker run --rm -v "$PWD/target/release":/b debian:10-slim /b/tantalum --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: target/release/tantalum
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin tantalum
          strip target/${{ matrix.target }}/release/tantalum
      - name: Smoke test
        # The runner is Apple silicon; the Intel build is only built.
        if: matrix.target == 'aarch64-apple-darwin'
        run: tools/smoke-test.sh target/${{ matrix.target }}/release/tantalum
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/tantalum
          if-no-files-found: error

  package:
    name: Package
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version" >&2
              exit 1
            fi
          else
            version="$version-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Licenses of the Rust crates
        run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bin
      - name: Archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          for dir in bin/bin-*; do
            target=${dir#bin/bin-}
            name=tantalum-$VERSION-$target
            mkdir "$name"
            cp "$dir/tantalum" "$name/"
            chmod +x "$name/tantalum"
            cp README.md LICENSE THIRD-PARTY-NOTICES.md THIRD-PARTY-LICENSES.html "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Tantalum $VERSION" --generate-notes --verify-tag "${prerelease[@]}"

  docker:
    name: Docker image
    needs: [linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-x86_64-unknown-linux-gnu
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-aarch64-unknown-linux-gnu
          path: dist/arm64
      - run: chmod +x dist/*/tantalum
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # Pre-releases get only their version; a release also moves `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
