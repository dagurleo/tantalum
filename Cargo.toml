[package]
name = "tantalum"
version = "0.33.0"
edition = "2024"

[dependencies]
foldhash = "0.2.0"
crc32fast = "1.5"
allocator-api2 = { version = "0.2.9", default-features = false, features = ["alloc"] }
itoa = "1.0.18"
memchr = "2.8.3"
mimalloc = "0.1.52"
parking_lot = "0.13.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
socket2 = "0.6"
# TLS on its own port (--tls-port). The ring backend builds without cmake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
monoio = "0.2.4"
# The index of big sets (`set.rs`): its `HashTable` stores plain positions.
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
mlua-sys = { version = "0.13", default-features = false, features = ["lua51", "external"] }
sha1_smol = "1"
# ACL passwords' SHA-256 and ACL GENPASS's random bits; rustls builds it already.
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The version monoio uses, to pass it ring setup flags.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6.4"

[dev-dependencies]
# Self-signed certificates for the TLS tests.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
lto = "fat"
codegen-units = 1

[build-dependencies]
cc = "1"
