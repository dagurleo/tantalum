# cargo-about: the licenses of the Rust crates built into the release binaries
# (`cargo about generate --locked about.hbs > THIRD-PARTY-LICENSES.html`, which the release
# workflow does). The vendored C code is in THIRD-PARTY-NOTICES.md.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-dev-dependencies = true
# Tantalum itself (MIT, LICENSE).
private = { ignore = true }
ignore-build-dependencies = false
